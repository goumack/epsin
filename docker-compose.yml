services:
  db:
    image: postgres:16-alpine
    container_name: epsin-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: epsin
      POSTGRES_DB: epsin
    ports:
      - "5440:5432"
    volumes:
      - epsin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d epsin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  epsin_data:
